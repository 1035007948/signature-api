server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: signature-api

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/signature_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL5InnoDBDialect
        format_sql: true

  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    timeout: 3000
    jedis:
      pool:
        max-active: 8
        max-wait: -1
        max-idle: 8
        min-idle: 0

swagger:
  enabled: true
  title: Signature API
  description: API for signature and verification
  version: 1.0.0
  base-package: com.example.signature.controller
  contact:
    name: Example Team
    email: example@example.com
